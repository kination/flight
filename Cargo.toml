[workspace]
members = ["sample-test/xpresso-echo"]
exclude = ["xpresso-ebpf"]
# xpresso-ebpf is NOT a workspace member.
# It must be compiled separately for the bpfel-unknown-none target.
# See build.sh for instructions.

[package]
name = "xpresso"
version = "0.1.0"
edition = "2021"

[dependencies]
pnet = "0.34.0"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.13"
libc = "0.2"
